[package]
name = "prompt-forge-core"
version = "1.0.0"
description = "纯逻辑层：输出规整 / 模式模板 / 配置模型 / 协议纯函数（零 Tauri 依赖，可独立测试）"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
