<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Forge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏：模式选择 + 设置入口 -->
  <header class="topbar">
    <div class="brand" title="Prompt Forge">
      <svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M9.5 1 3 9h4l-1 6 7-8.5H8.5L9.5 1z"/></svg>
      <span>Prompt Forge</span>
    </div>
    <div class="topbar-right">
      <select id="modeSelect" class="mode-select" title="增强模式"></select>
      <button id="settingsBtn" class="icon-btn" title="设置">
        <svg width="15" height="15" viewBox="0 0 16 16"><path fill="currentColor" d="M8 4.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5zM13.3 8c0 .34-.03.67-.09 1l1.4 1.1-1.2 2.08-1.66-.6c-.5.42-1.08.75-1.72.96L9.75 14.3h-2.4l-.28-1.76a4.9 4.9 0 0 1-1.72-.96l-1.66.6-1.2-2.08L3.9 9a5.4 5.4 0 0 1 0-2l-1.4-1.1 1.2-2.08 1.66.6c.5-.42 1.08-.75 1.72-.96l.28-1.76h2.4l.28 1.76c.64.21 1.22.54 1.72.96l1.66-.6 1.2 2.08L13.2 7c.06.33.09.66.09 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <!-- 输入区 -->
    <section class="pane">
      <label class="pane-label" for="inputBox">原始提示词</label>
      <textarea id="inputBox" placeholder="输入简短指令，如：帮我写周报" spellcheck="false"></textarea>
    </section>

    <!-- 操作条 -->
    <div class="action-row">
      <button id="enhanceBtn" class="primary-btn">增强</button>
      <button id="historyBtn" class="ghost-btn" title="最近 20 条增强记录">历史</button>
      <span id="statusText" class="status"></span>
    </div>

    <!-- 历史面板（内嵌下拉卡） -->
    <div id="historyPanel" class="hidden" style="border:1px solid var(--border,#ddd);border-radius:6px;max-height:160px;overflow-y:auto;margin:4px 0"></div>

    <!-- 输出区 -->
    <section class="pane grow">
      <div class="pane-label-row">
        <label class="pane-label" for="outputBox">增强结果</label>
        <button id="copyBtn" class="ghost-btn" disabled>复制</button>
      </div>
      <textarea id="outputBox" placeholder="增强后的提示词将显示在这里" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <!-- 设置面板（模态覆盖层） -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>设置</h2>
        <button id="closeSettings" class="icon-btn" title="关闭">✕</button>
      </div>

      <div class="settings-body">
        <!-- LLM 配置管理 -->
        <h3>模型配置</h3>
        <div class="profile-row">
          <select id="profileSelect" class="full"></select>
          <button id="newProfile" class="ghost-btn">新建</button>
          <button id="delProfile" class="ghost-btn danger">删除</button>
        </div>

        <div class="form-grid">
          <label>配置名称</label>
          <input id="pfName" type="text" placeholder="如：DeepSeek" />

          <label>协议</label>
          <select id="pfProtocol">
            <option value="openai">OpenAI 兼容</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="ollama">Ollama</option>
            <option value="gemini">Gemini</option>
          </select>

          <label>Base URL</label>
          <input id="pfBaseUrl" type="text" placeholder="https://api.deepseek.com" />

          <label>模型</label>
          <input id="pfModel" type="text" placeholder="deepseek-chat" />

          <label>API Key</label>
          <input id="pfApiKey" type="password" placeholder="本地 Ollama 可留空" />

          <label>Temperature</label>
          <input id="pfTemp" type="number" min="0" max="2" step="0.1" value="0.7" />
        </div>

        <div class="row-gap">
          <button id="testBtn" class="ghost-btn">测试连接</button>
          <span id="testResult" class="status"></span>
        </div>

        <hr />

        <!-- 自定义模式（P1-1 模板外置） -->
        <h3>自定义模式</h3>
        <div class="profile-row">
          <select id="cmSelect" class="full"></select>
          <button id="cmNew" class="ghost-btn">新建</button>
          <button id="cmDel" class="ghost-btn danger">删除</button>
        </div>
        <div class="form-grid">
          <label>模式 ID</label>
          <input id="cmId" type="text" placeholder="英文短名，如 code-review" />
          <label>名称</label>
          <input id="cmName" type="text" placeholder="如：代码审查" />
          <label>类型</label>
          <select id="cmType">
            <option value="extend">继承（保留保真纪律）</option>
            <option value="replace">替换（完全自写）</option>
          </select>
        </div>
        <label class="pane-label" for="cmTemplate" style="display:block">策略模板</label>
        <textarea id="cmTemplate" rows="4" placeholder="extend 型只写策略要求；replace 型写完整指令" spellcheck="false" style="min-height:70px;flex:none"></textarea>

        <hr />

        <!-- 系统集成 -->
        <h3>系统集成</h3>
        <label class="switch-row">
          <input id="optCloseTray" type="checkbox" />
          <span>关闭窗口时最小化到托盘</span>
        </label>
        <label class="switch-row">
          <input id="optAutostart" type="checkbox" />
          <span>开机自启动</span>
        </label>
      </div>

      <div class="settings-footer">
        <span id="saveHint" class="status"></span>
        <button id="saveSettings" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
