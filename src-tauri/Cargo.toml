[package]
name = "prompt-forge"
version = "1.0.0"
description = "轻量级提示词快速增强工具"
authors = ["Prompt Forge"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "prompt_forge_lib"
# 桌面端仅需 rlib；staticlib/cdylib 仅供 mobile，且 gnu 链接 cdylib 会触发 export ordinal 溢出
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
prompt-forge-core = { path = "../crates/prompt-forge-core" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["rt", "macros"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"     # 体积优先
lto = true
codegen-units = 1
strip = true
panic = "abort"
